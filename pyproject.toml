[project]
name = "job-scrapy"
version = "0.1.0"
description = "An open-source MCP server for real-time job discovery across multiple job sources."
authors = [{name = "Ben Mishal"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "jobspy",
    "pandas",
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "pydantic",
    "pydantic-settings"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100
lint.ignore = ["BLE001", "DTZ007"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
